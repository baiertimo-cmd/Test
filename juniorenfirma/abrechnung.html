<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juniorenfirma Abrechnung</title>
<style>
:root{
  --bg:#f3f5f8;--panel:#fff;--text:#1c2433;--muted:#5d6879;--line:#dde2ea;--line2:#c6cedb;
  --brand:#1f5fae;--brand-d:#184c8c;--brand-l:#e9f1fb;
  --ok:#1b7443;--ok-l:#e5f3eb;--bad:#b2261d;--bad-l:#fbeae9;--warn:#8f5b00;--warn-l:#fff3d9;
  --side:#14233b;--side-2:#1e3354;--side-3:#2a4874;
  --radius:8px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
h1{font-size:23px;margin:0}
h2{font-size:18px;margin:0}
h3{font-size:15px;margin:18px 0 8px}
p{margin:0 0 10px}
a{color:var(--brand)}
.muted{color:var(--muted)}
.small{font-size:13px}
.pos{color:var(--ok)}
.neg{color:var(--bad)}
.r{text-align:right}
.nowrap{white-space:nowrap}
.hidden{display:none!important}

/* Layout */
.layout{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#d5deec;display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--side-2);margin-bottom:10px}
.brand img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:6px;padding:2px}
.brand-name{font-weight:600;color:#fff;line-height:1.2}
.brand-sub{font-size:12px;color:#9fb0c8}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer;margin-bottom:2px}
.nav button:hover{background:var(--side-2)}
.nav button.active{background:var(--side-3);color:#fff;font-weight:600}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--side-2);font-size:13px}
.save-status{margin-bottom:10px;line-height:1.5}
.save-status .fname{color:#9fb0c8;font-size:12px;word-break:break-all}
.save-status .btn{margin-top:6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.dot.ok{background:#4cc27f}.dot.warn{background:#f1b33c}.dot.bad{background:#ff6b5e}
.user{color:#fff;margin-bottom:4px}
.side-btns{display:flex;gap:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:0;color:#9fc1f0;font:inherit;cursor:pointer;text-decoration:underline}
.main{padding:24px 28px 60px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line2);background:#fff;color:var(--text);padding:7px 14px;border-radius:6px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:#f2f5f9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad);border-color:#e5b7b3}
.btn.danger:hover{background:var(--bad-l)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.ghost:hover{background:var(--brand-l)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.big{padding:11px 18px;font-size:16px;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:4px 8px;border-radius:5px}
.icon-btn:hover{background:#eef1f5;color:var(--text)}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line2);border-radius:6px;background:#fff;color:var(--text);width:100%;min-width:0}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc0ee;outline-offset:0;border-color:var(--brand)}
input[type=checkbox]{width:auto}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
label.fld>input,label.fld>select,label.fld>textarea{color:var(--text);font-size:15px}
label.check{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0 12px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.span2{grid-column:span 2}

/* Cards, KPIs */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card>h2{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.kpi .label{color:var(--muted);font-size:13px}
.kpi .val{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .sub{font-size:12px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.quick button{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer;font:inherit}
.quick button:hover{border-color:var(--brand);background:var(--brand-l)}
.quick b{display:block;font-size:15px}
.quick span{font-size:12.5px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{min-width:0;overflow-x:auto}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.list th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;background:#f8f9fb;font-weight:600;white-space:nowrap}
table.list td.r,table.list th.r{text-align:right;font-variant-numeric:tabular-nums}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr:hover{background:#fafbfd}
table.list tfoot td{font-weight:600;background:#f8f9fb;border-top:2px solid var(--line)}
table.list .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
tr.storno td{color:var(--muted);text-decoration:line-through}
tr.storno td.acts-cell{text-decoration:none}
tr.low td{background:var(--warn-l)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-l);color:var(--ok)}
.badge.bad{background:var(--bad-l);color:var(--bad)}
.badge.warn{background:var(--warn-l);color:var(--warn)}
.badge.info{background:var(--brand-l);color:var(--brand-d)}
.badge.muted{background:#eceff3;color:var(--muted)}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px 0;margin-bottom:12px}
.filters label.fld{min-width:140px;flex:0 1 170px}
.filters label.fld.grow{flex:1 1 220px}
.filters .btn{margin-bottom:10px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sumbar{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 12px;font-size:14px}
.sumbar b{font-variant-numeric:tabular-nums}

/* Alerts */
.alert{padding:10px 14px;border-radius:6px;margin:10px 0;font-size:14px;border:1px solid}
.alert.warn{background:var(--warn-l);border-color:#efd391;color:#5e3c00}
.alert.bad{background:var(--bad-l);border-color:#efc0bc;color:#7d1a14}
.alert.info{background:var(--brand-l);border-color:#c3d7f1;color:#163f72}
.alert ul{margin:4px 0 0;padding-left:18px}
.form-err:empty{display:none}

/* Start / login */
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.start{width:min(520px,100%);padding:28px}
.start h1{margin-bottom:6px}
.start .btn{margin-top:10px}
.start .hint{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.5}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(14,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:10px;width:min(580px,100%);box-shadow:0 18px 50px rgba(0,0,0,.25);display:flex;flex-direction:column;max-width:100%}
.modal.wide{width:min(1060px,100%)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#f8f9fb;border-radius:0 0 10px 10px;flex-wrap:wrap}
.modal-foot .left{margin-right:auto}

/* Positions editor */
table.positems{width:100%;border-collapse:collapse;margin-bottom:8px}
table.positems th{font-size:12px;color:var(--muted);text-align:left;padding:4px;font-weight:600}
table.positems td{padding:3px 4px;vertical-align:middle}
table.positems .c-art{width:26%}.positems .c-menge{width:9%}.positems .c-einh{width:11%}.positems .c-preis{width:12%}.positems .c-sum{width:11%;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos-total{text-align:right;font-variant-numeric:tabular-nums;line-height:1.6}
.pos-total b{font-size:17px}
.row-between{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}

/* Toast */
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#1c2a40;color:#fff;padding:10px 16px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:14px;max-width:360px}
.toast.bad{background:var(--bad)}
.demo-banner{background:var(--warn-l);border:1px solid #efd391;color:#5e3c00;padding:8px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}

/* Report bars */
.bar{height:8px;background:#e5eaf1;border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%}
.bar.e>i{background:#3a9a64}.bar.a>i{background:#d1574e}
.result{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:10px}
  .brand{border:0;padding-bottom:6px;margin-bottom:4px}
  .nav{display:flex;flex-wrap:wrap;gap:4px}
  .nav button{width:auto;padding:6px 10px;font-size:14px}
  .side-foot{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
  .main{padding:16px}
  .grid2,.grid3,.grid4,.cols2{grid-template-columns:1fr}
  .span2{grid-column:auto}
  table.positems thead{display:none}
  table.positems tr{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-bottom:1px solid var(--line);padding:6px 0}
  table.positems td{width:auto!important}
}

/* Print */
#print-root{display:none}
@media print{
  @page{size:A4;margin:16mm 18mm 18mm}
  body{background:#fff;font-size:10.5pt}
  body.printing #app,body.printing #modal-root,body.printing #toasts{display:none!important}
  body.printing #print-root{display:block}
}
.pdoc{color:#111;font-size:10.5pt;line-height:1.45}
.p-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12mm}
.p-logo{max-height:22mm;max-width:60mm}
.p-firm{text-align:right;font-size:9pt;color:#333}
.p-fname{font-size:14pt;font-weight:700;color:#111}
.p-addr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10mm;margin-bottom:10mm}
.p-addr{width:85mm;min-height:35mm}
.p-sender{font-size:7.5pt;border-bottom:1px solid #999;padding-bottom:1mm;margin-bottom:3mm;color:#333}
.p-meta{font-size:9.5pt;border-collapse:collapse}
.p-meta td{padding:1px 0 1px 8mm}
.p-meta td:first-child{color:#555;padding-left:0}
.p-title{font-size:15pt;margin:0 0 5mm}
.p-storno{border:2px solid #b2261d;color:#b2261d;font-weight:700;display:inline-block;padding:1mm 4mm;margin-bottom:4mm;letter-spacing:.1em}
.p-pos,.p-tab{width:100%;border-collapse:collapse;margin:3mm 0 5mm}
.p-pos th,.p-tab th{border-bottom:1.5px solid #333;text-align:left;padding:1.5mm 2mm;font-size:9pt}
.p-pos td,.p-tab td{border-bottom:1px solid #ddd;padding:1.5mm 2mm;vertical-align:top}
.p-pos .r,.p-tab .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-pos tfoot td{border:0;padding-top:1mm}
.p-pos tr.p-total td{border-top:1.5px solid #333;font-weight:700;font-size:11.5pt}
.p-tab tfoot td{font-weight:700;border-top:1.5px solid #333;border-bottom:0}
.p-small{font-size:9pt;color:#444}
.p-foot{margin-top:14mm;border-top:1px solid #999;padding-top:2mm;display:flex;justify-content:space-between;gap:6mm;font-size:7.5pt;color:#444}
.p-report h1{font-size:16pt;margin:0 0 2mm}
.p-report h2{font-size:12pt;margin:6mm 0 1mm}
.p-sign{margin-top:18mm;display:flex;gap:20mm}
.p-sign div{border-top:1px solid #333;padding-top:1mm;width:60mm;font-size:8.5pt}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="print-root"></div>
<script>
'use strict';
(function(){

/* ===================== Hilfsfunktionen ===================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=v=>esc(JSON.stringify(v));
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const r2=n=>Math.round((+n||0)*100+((+n||0)>=0?1e-7:-1e-7))/100;
const eur=n=>(+n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});
const fmtNum=n=>(+n||0).toLocaleString('de-DE',{maximumFractionDigits:3});
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>isoDate(new Date());
const fmtD=s=>s?String(s).slice(0,10).split('-').reverse().join('.'):'';
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+(+n||0));return isoDate(d);};
const nowStamp=()=>new Date().toISOString();
const fmtTs=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleDateString('de-DE')+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});};
const firstLine=s=>String(s||'').split('\n')[0].trim();
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=(arr,f)=>r2(arr.reduce((s,x)=>s+(+f(x)||0),0));
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const ROLE={lehrkraft:'Lehrkraft',schueler:'Schüler/in'};
const ZA={bar:'bar (Kasse)',bank:'Bank/Überweisung'};
const BEW_ART={anfang:'Anfangsbestand',einkauf:'Einkauf',verkauf:'Verkauf',korrektur:'Korrektur'};
const canFS=typeof window.showOpenFilePicker==='function'&&typeof window.showSaveFilePicker==='function';

/* SHA-256 (Fallback, falls crypto.subtle nicht verfügbar ist) */
function sha256js(str){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a));
  const bytes=new TextEncoder().encode(str);
  const H=[],K=[];let n=2,c=0;
  const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;};
  while(c<64){if(isP(n)){if(c<8)H[c]=(Math.pow(n,1/2)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++;}n++;}
  const l=bytes.length,buf=new Uint8Array(((l+9+63)>>6)<<6);buf.set(bytes);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(buf.length-4,(l*8)>>>0);dv.setUint32(buf.length-8,Math.floor(l*8/4294967296));
  const w=new Array(64);
  for(let i=0;i<buf.length;i+=64){
    for(let j=0;j<16;j++)w[j]=dv.getUint32(i+j*4);
    for(let j=16;j<64;j++){const s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3),s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);w[j]=(w[j-16]+s0+w[j-7]+s1)|0;}
    let[a,b,cc,d,e,f,g,h]=H;
    for(let j=0;j<64;j++){
      const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[j]+w[j])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&cc)^(b&cc)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=b;b=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
async function sha256(str){
  try{
    if(window.crypto&&crypto.subtle){
      const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
      return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256js(str);
}
const hashPw=(salt,pw)=>sha256(salt+':'+pw);

/* ===================== Datenmodell ===================== */
function defaultDB(){
  return{
    app:'juniorenfirma-abrechnung',version:1,
    meta:{created:nowStamp(),lastSaved:null,saveId:null},
    settings:{
      firma:{name:'Meine Juniorenfirma',zusatz:'',strasse:'',plzOrt:'',telefon:'',email:'',web:'',bank:'',inhaber:'',iban:'',bic:'',logo:''},
      prefix:{rechnung:'RE',angebot:'AN',einkauf:'EK',buchung:'BU'},
      zahlungszielTage:14,angebotGueltigTage:30,
      steuerhinweis:'Gemäß § 19 UStG wird keine Umsatzsteuer berechnet.',
      textRechnung:'Vielen Dank für Ihren Auftrag. Wir berechnen Ihnen folgende Leistungen:',
      textAngebot:'Vielen Dank für Ihre Anfrage. Gerne unterbreiten wir Ihnen folgendes Angebot:',
      katEinnahmen:['Umsatzerlöse','Spenden','Zuschüsse','Sonstige Einnahmen'],
      katAusgaben:['Wareneinkauf','Material & Verbrauch','Werbung','Gebühren','Veranstaltungen','Sonstige Ausgaben'],
      einheiten:['Stück','Packung','Set','Stunde','Pauschal'],
      anfangBar:0,anfangBank:0
    },
    users:[],kontakte:[],artikel:[],bewegungen:[],buchungen:[],einkaeufe:[],dokumente:[],protokoll:[]
  };
}
function migrate(data){
  if(!data||typeof data!=='object'||!Array.isArray(data.buchungen))throw new Error('Die Datei ist keine gültige Datendatei der Juniorenfirma-Abrechnung.');
  const d=defaultDB();
  const out=Object.assign(d,data);
  out.meta=Object.assign(defaultDB().meta,data.meta||{});
  out.settings=Object.assign(defaultDB().settings,data.settings||{});
  out.settings.firma=Object.assign(defaultDB().settings.firma,(data.settings||{}).firma||{});
  out.settings.prefix=Object.assign(defaultDB().settings.prefix,(data.settings||{}).prefix||{});
  ['users','kontakte','artikel','bewegungen','buchungen','einkaeufe','dokumente','protokoll'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=[];});
  return out;
}

/* ===================== Zustand ===================== */
let DB=null,currentUser=null,view='dashboard';
let fileHandle=null,fileName='',lastMod=0,lastSaveId=null,dirty=false,saving=false,pendingSave=false,saveError=false,lastSavedAt='';
let lastHandle=null,demoMode=false,saveTimer=null;
const F={

/* ===================== IndexedDB (zuletzt verwendete Datei merken) ===================== */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('jf-abrechnung',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const db=await idb();return await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});}catch(e){return null;}}
async function idbSet(k,v){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}

/* ===================== Speichern ===================== */
function log(text){
  DB.protokoll.push({ts:nowStamp(),user:currentUser?currentUser.name:'-',text});
  if(DB.protokoll.length>2000)DB.protokoll.splice(0,DB.protokoll.length-2000);
}
function commit(logText){
  if(logText)log(logText);
  dirty=true;
  try{localStorage.setItem('jf_arbeitskopie',JSON.stringify(DB));}catch(e){}
  updateSaveStatus();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>saveNow(),350);
}
async function readExternal(){
  // liefert die Daten aus der Datei, falls sie von jemand anderem geändert wurde, sonst null
  const f=await fileHandle.getFile();
  if(f.lastModified===lastMod)return null;
  const data=JSON.parse(await f.text());
  if(data&&data.meta&&data.meta.saveId&&data.meta.saveId===lastSaveId){lastMod=f.lastModified;return null;}
  return data;
}
async function saveNow(force){
  if(!fileHandle){updateSaveStatus();return;}
  if(saving){pendingSave=true;return;}
  saving=true;saveError=false;
  try{
    if(!force&&lastMod){
      const ext=await readExternal();
      if(ext){saving=false;showConflict();return;}
    }
    DB.meta.lastSaved=nowStamp();
    DB.meta.saveId=uid();
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(DB));
    await w.close();
    lastSaveId=DB.meta.saveId;
    lastMod=(await fileHandle.getFile()).lastModified;
    dirty=false;
    lastSavedAt=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    saveError=true;console.error(e);
    toast('Speichern fehlgeschlagen: '+(e.message||e),'bad');
  }
  saving=false;updateSaveStatus();
  if(pendingSave){pendingSave=false;saveNow();}
}
function showConflict(){
  const m=openModal('Daten wurden zwischenzeitlich geändert',
    `<p>Die Datendatei wurde inzwischen an einem anderen Arbeitsplatz geändert. Ihre letzte Änderung ist noch <b>nicht</b> gespeichert.</p>
     <p><b>Neu laden</b> übernimmt den aktuellen Stand der Datei (Ihre letzte Änderung geht verloren und muss ggf. erneut eingegeben werden).<br>
     <b>Überschreiben</b> speichert Ihren Stand – die Änderungen des anderen Arbeitsplatzes gehen dann verloren.</p>`,
    `<button class="btn danger left" data-act="over">Überschreiben</button><button class="btn primary" data-act="reload">Neu laden (empfohlen)</button>`);
  m.querySelector('[data-act=reload]').onclick=async()=>{closeModal();try{const f=await fileHandle.getFile();DB=migrate(JSON.parse(await f.text()));lastMod=f.lastModified;lastSaveId=DB.meta.saveId;dirty=false;checkUserStillValid();render();toast('Aktueller Stand geladen.');}catch(e){toast('Fehler: '+e.message,'bad');}};
  m.querySelector('[data-act=over]').onclick=()=>{closeModal();saveNow(true);};
  void ext;
}
function checkUserStillValid(){
  if(currentUser){const u=DB.users.find(x=>x.id===currentUser.id&&x.active!==false);if(!u)currentUser=null;else currentUser={id:u.id,name:u.name,role:u.role};}
}
function download(content,filename,type){
  const blob=content instanceof Blob?content:new Blob([content],{type});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
async function saveAs(){
  if(canFS){
    try{
      const h=await showSaveFilePicker({suggestedName:fileName||'juniorenfirma-daten.json',types:[{description:'Juniorenfirma-Daten',accept:{'application/json':['.json']}}]});
      fileHandle=h;fileName=h.name;lastMod=0;demoMode=false;
      await saveNow(true);idbSet('lastHandle',h);render();toast('Gespeichert in '+h.name);
    }catch(e){if(e.name!=='AbortError')toast('Fehler: '+e.message,'bad');}
  }else{
    DB.meta.lastSaved=nowStamp();
    download(JSON.stringify(DB),fileName||'juniorenfirma-daten.json','application/json');
    dirty=false;updateSaveStatus();
  }
}
function saveStatusHTML(){
  if(fileHandle){
    if(saveError)return`<span class="dot bad"></span>Fehler beim Speichern<br><button class="btn small" onclick="App.saveNow()">Erneut versuchen</button>`;
    if(dirty)return`<span class="dot warn"></span>Speichere …<div class="fname">${esc(fileHandle.name)}</div>`;
    return`<span class="dot ok"></span>Gespeichert${lastSavedAt?' '+lastSavedAt:''}<div class="fname">${esc(fileHandle.name)}</div>`;
  }
  return`${dirty?'<span class="dot warn"></span>Nicht gespeicherte Änderungen':'<span class="dot ok"></span>Keine offenen Änderungen'}
    <div class="fname">${demoMode?'Beispieldaten (nicht gespeichert)':esc(fileName||'noch nicht gespeichert')}</div>
    <button class="btn small" onclick="App.saveAs()">${canFS?'Speichern unter …':'Datei speichern (Download)'}</button>`;
}
function updateSaveStatus(){const el=$('#saveStatus');if(el)el.innerHTML=saveStatusHTML();}

/* ===================== UI-Basics: Modal, Toast, Bestätigung ===================== */
const modals=[];
function openModal(title,body,footer,opts={}){
  const wrap=document.createElement('div');
  wrap.className='modal-back';
  wrap.innerHTML=`<div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="modal-body">${body}</div>
    ${footer!==null?`<div class="modal-foot">${footer||'<button class="btn" data-close>Schließen</button>'}</div>`:''}</div>`;
  wrap.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal();});
  $('#modal-root').appendChild(wrap);modals.push(wrap);
  const f=wrap.querySelector('.modal-body input:not([type=hidden]):not([readonly]),.modal-body select,.modal-body textarea');
  if(f&&!opts.noFocus)setTimeout(()=>f.focus(),20);
  return wrap;
}
function closeModal(){const m=modals.pop();if(m)m.remove();}
function closeAllModals(){while(modals.length)closeModal();}
function ask(text,okLabel='OK',danger=false){
  return new Promise(res=>{
    const m=openModal('Bitte bestätigen',`<p>${text}</p>`,`<button class="btn" data-act="no">Abbrechen</button><button class="btn ${danger?'bad':'primary'}" data-act="yes">${esc(okLabel)}</button>`,{noFocus:true});
    m.querySelector('[data-act=yes]').onclick=()=>{closeModal();res(true);};
    m.querySelector('[data-act=no]').onclick=()=>{closeModal();res(false);};
    m.querySelector('[data-close]').onclick=()=>{res(false);};
    setTimeout(()=>m.querySelector('[data-act=yes]').focus(),20);
  });
}
function toast(msg,kind){
  const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?6000:3200);
}
function formErr(list){
  const el=$$('.modal-back').pop()?.querySelector('.form-err');
  if(!el){toast(Array.isArray(list)?list.join(' '):list,'bad');return;}
  const arr=Array.isArray(list)?list:[list];
  el.innerHTML=`<div class="alert bad">${arr.length>1?`<b>${esc(arr[0])}</b><ul>${arr.slice(1).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:esc(arr[0])}</div>`;
  el.scrollIntoView({block:'nearest'});
}
const val=id=>{const el=document.getElementById(id);return el?(el.type==='checkbox'?el.checked:el.value):'';};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length)closeModal();});

/* ===================== Nummernkreise, Summen, Bestand ===================== */
function nextNr(prefix,list,datum,key='nr'){
  const y=(datum||today()).slice(0,4);
  const re=new RegExp('^'+reEsc(prefix)+'-'+y+'-(\\d+)$');
  let max=0;list.forEach(x=>{const m=re.exec(x[key]||'');if(m)max=Math.max(max,+m[1]);});
  return`${prefix}-${y}-${String(max+1).padStart(3,'0')}`;
}
function nextArtNr(){let max=0;DB.artikel.forEach(a=>{const m=/^A-(\d+)$/.exec(a.nr||'');if(m)max=Math.max(max,+m[1]);});return'A-'+String(max+1).padStart(3,'0');}
const posSum=p=>r2((+p.menge||0)*(+p.preis||0));
function docSum(d){
  const zw=sum(d.positionen||[],posSum);
  const rabatt=r2(zw*(+d.rabatt||0)/100);
  return{zwischen:zw,rabatt,gesamt:r2(zw-rabatt)};
}
const ekSum=e=>sum(e.positionen||[],posSum);
function stockMap(){const m={};DB.bewegungen.forEach(b=>{m[b.artikelId]=(m[b.artikelId]||0)+(+b.menge||0);});for(const k in m)m[k]=Math.round(m[k]*1000)/1000;return m;}
const isLager=a=>a&&a.lager!==false;
function movesFor(positionen,sign){
  return(positionen||[]).filter(p=>p.artikelId&&isLager(artikelById(p.artikelId))).map(p=>({artikelId:p.artikelId,menge:sign*(+p.menge||0)}));
}
function stockProblems(bezugId,newMoves){
  const m={};
  DB.bewegungen.forEach(b=>{if(b.bezug!==bezugId)m[b.artikelId]=(m[b.artikelId]||0)+(+b.menge||0);});
  newMoves.forEach(x=>{m[x.artikelId]=(m[x.artikelId]||0)+x.menge;});
  const affected=new Set([...DB.bewegungen.filter(b=>b.bezug===bezugId).map(b=>b.artikelId),...newMoves.map(x=>x.artikelId)]);
  const out=[];
  affected.forEach(id=>{const a=artikelById(id);if(isLager(a)&&m[id]<-1e-9){
    const vorh=r2((m[id]||0)-newMoves.filter(x=>x.artikelId===id).reduce((s,x)=>s+x.menge,0));
    out.push(`${a.name}: verfügbar ${fmtNum(vorh)} ${a.einheit||''}, benötigt ${fmtNum(-newMoves.filter(x=>x.artikelId===id).reduce((s,x)=>s+x.menge,0))} → Bestand wäre ${fmtNum(m[id])}`);}});
  return out;
}
function syncDoc(d){
  DB.bewegungen=DB.bewegungen.filter(b=>b.bezug!==d.id);
  DB.buchungen=DB.buchungen.filter(b=>!(b.quelle&&b.quelle.id===d.id));
  if(d.typ!=='rechnung'||d.status==='storniert')return;
  movesFor(d.positionen,-1).forEach(x=>DB.bewegungen.push({id:uid(),datum:d.datum,artikelId:x.artikelId,menge:x.menge,art:'verkauf',bezug:d.id,text:'Rechnung '+d.nr+' – '+firstLine(d.empfaenger),created:nowStamp()}));
  if(d.status==='bezahlt')DB.buchungen.push({id:uid(),datum:d.bezahltAm,typ:'einnahme',betrag:docSum(d).gesamt,kategorie:'Umsatzerlöse',
    beschreibung:'Rechnung '+d.nr+' – '+firstLine(d.empfaenger),beleg:d.nr,zahlungsart:d.zahlungsart||'bar',kontaktId:d.kundeId||null,
    quelle:{art:'rechnung',id:d.id},user:d.user,created:nowStamp()});
}
function syncEinkauf(e){
  DB.bewegungen=DB.bewegungen.filter(b=>b.bezug!==e.id);
  DB.buchungen=DB.buchungen.filter(b=>!(b.quelle&&b.quelle.id===e.id));
  movesFor(e.positionen,1).forEach(x=>DB.bewegungen.push({id:uid(),datum:e.datum,artikelId:x.artikelId,menge:x.menge,art:'einkauf',bezug:e.id,text:'Einkauf '+e.nr+' – '+e.lieferantName,created:nowStamp()}));
  if(e.status==='bezahlt')DB.buchungen.push({id:uid(),datum:e.bezahltAm,typ:'ausgabe',betrag:ekSum(e),kategorie:e.kategorie||'Wareneinkauf',
    beschreibung:'Einkauf '+e.nr+' – '+e.lieferantName+(e.beleg?' (Beleg '+e.beleg+')':''),beleg:e.nr,zahlungsart:e.zahlungsart||'bar',kontaktId:e.lieferantId||null,
    quelle:{art:'einkauf',id:e.id},user:e.user,created:nowStamp()});
}
function kassenstand(){
  const r={bar:+S().anfangBar||0,bank:+S().anfangBank||0};
  DB.buchungen.forEach(b=>{const k=b.zahlungsart==='bank'?'bank':'bar';r[k]+=(b.typ==='einnahme'?1:-1)*(+b.betrag||0);});
  r.bar=r2(r.bar);r.bank=r2(r.bank);return r;
}
function rechnungStatus(d){
  if(d.status==='storniert')return'storniert';
  if(d.status==='bezahlt')return'bezahlt';
  return d.faellig&&d.faellig<today()?'ueberfaellig':'offen';
}
function statusBadge(d){
  if(d.typ==='rechnung'){
    const s=rechnungStatus(d);
    if(s==='storniert')return'<span class="badge muted">storniert</span>';
    if(s==='bezahlt')return`<span class="badge ok">bezahlt ${fmtD(d.bezahltAm)} · ${d.zahlungsart==='bank'?'Bank':'bar'}</span>`;
    if(s==='ueberfaellig')return`<span class="badge bad">überfällig seit ${fmtD(d.faellig)}</span>`;
    return`<span class="badge warn">offen · fällig ${fmtD(d.faellig)}</span>`;
  }
  if(d.status==='angenommen'){const r=docById(d.rechnungId);return`<span class="badge ok">angenommen${r?' → '+esc(r.nr):''}</span>`;}
  if(d.status==='abgelehnt')return'<span class="badge muted">abgelehnt</span>';
  if(d.gueltigBis&&d.gueltigBis<today())return`<span class="badge bad">abgelaufen ${fmtD(d.gueltigBis)}</span>`;
  return`<span class="badge info">offen · gültig bis ${fmtD(d.gueltigBis)}</span>`;
}

/* ===================== CSV ===================== */
function csv(rows,filename){
  const cell=c=>{
    let v=typeof c==='number'?c.toFixed(2).replace('.',','):String(c??'');
    if(typeof c!=='number'&&/^[=+@\t\r]/.test(v))v="'"+v;
    if(/[";\n\r]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
    return v;
  };
  download('﻿'+rows.map(r=>r.map(cell).join(';')).join('\r\n'),filename,'text/csv;charset=utf-8');
}

/* ===================== Drucken ===================== */
function doPrint(html,title){
  const pr=$('#print-root');pr.innerHTML=html;
  document.body.classList.add('printing');
  const old=document.title;document.title=title;
  const done=()=>{document.body.classList.remove('printing');pr.innerHTML='';document.title=old;window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  const imgs=$$('img',pr).map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r;}));
  Promise.all(imgs).then(()=>setTimeout(()=>window.print(),60));
}

  if(!DB)return renderStart();
  if(!DB.users.length)return renderSetup();
  if(!currentUser)return renderLogin();
  if(view==='einstellungen'&&!isLK())view='dashboard';
  const V={dashboard:vDashboard,verkauf:vVerkauf,angebote:vAngebote,einkauf:vEinkauf,inventar:vInventar,buchungen:vBuchungen,auswertung:vAuswertung,kontakte:vKontakte,einstellungen:vEinstellungen};
  const scrollY=window.scrollY;
  app.innerHTML=shell((V[view]||vDashboard)());
  window.scrollTo(0,scrollY);
}

    <div class="side-foot">

      <div><div class="user">${esc(currentUser.name)} · ${ROLE[currentUser.role]}</div>

    </div></aside>

}
function pageHead(title,buttons=''){return`<div class="page-head"><h1>${title}</h1><div class="btns">${buttons}</div></div>`;}
function table(head,rows,foot,emptyText='Noch keine Einträge vorhanden.'){
  if(!rows.length)return`<div class="table-wrap"><div class="empty">${emptyText}</div></div>`;
  return`<div class="table-wrap"><table class="list"><thead><tr>${head.map(h=>{const [t,c]=Array.isArray(h)?h:[h,''];return`<th class="${c}">${t}</th>`;}).join('')}</tr></thead><tbody>${rows.join('')}</tbody>${foot?`<tfoot>${foot}</tfoot>`:''}</table></div>`;
}
/* Filter-Bausteine */
const fDate=(v,k,l)=>`<label class="fld">${l}<input type="date" value="${esc(F[v][k])}" onchange="App.setF('${v}','${k}',this.value)"></label>`;
const fText=(v,k,l,ph)=>`<label class="fld grow">${l}<input type="search" value="${esc(F[v][k])}" placeholder="${esc(ph||'')}" onchange="App.setF('${v}','${k}',this.value)"></label>`;
const fSel=(v,k,l,opts)=>`<label class="fld">${l}<select onchange="App.setF('${v}','${k}',this.value)">${opts.map(([o,t])=>`<option value="${esc(o)}" ${F[v][k]===o?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
const fReset=v=>`<button class="btn ghost" onclick="App.resetF('${v}')">Filter zurücksetzen</button>`;
const inRange=(d,von,bis)=>(!von||d>=von)&&(!bis||d<=bis);

/* ---------- Verkauf & Rechnungen ---------- */
function filteredRechnungen(){
  const f=F.verkauf;
  let list=DB.dokumente.filter(d=>d.typ==='rechnung'&&inRange(d.datum,f.von,f.bis));
  if(f.status)list=list.filter(d=>rechnungStatus(d)===f.status||(f.status==='offen'&&rechnungStatus(d)==='ueberfaellig'));
  if(f.q){const q=f.q.toLowerCase();list=list.filter(d=>(d.nr+' '+d.empfaenger+' '+d.positionen.map(p=>p.bezeichnung).join(' ')).toLowerCase().includes(q));}
  return list.sort((a,b)=>b.datum.localeCompare(a.datum)||b.nr.localeCompare(a.nr));
}
function vVerkauf(){
  const list=filteredRechnungen();
  const aktiv=list.filter(d=>d.status!=='storniert');
  const rows=list.map(d=>{
    const st=d.status;
    const a=[`<button class="btn small" onclick="App.printDoc('${d.id}')">Drucken / PDF</button>`];
    if(st==='offen')a.push(`<button class="btn small ok" onclick="App.bezahlt('${d.id}')">Bezahlt</button>`,`<button class="btn small" onclick="App.docEditor('rechnung','${d.id}')">Bearbeiten</button>`);
    if(st!=='storniert')a.push(`<button class="btn small danger" onclick="App.storno('${d.id}')">Stornieren</button>`);
    if(st==='bezahlt'&&isLK())a.push(`<button class="btn small" onclick="App.zahlungZurueck('${d.id}')" title="Nur Lehrkraft">Zahlung zurücknehmen</button>`);
    if(isLK())a.push(`<button class="btn small danger" onclick="App.delDoc('${d.id}')" title="Nur Lehrkraft">Löschen</button>`);
    return`<tr class="${st==='storniert'?'storno':''}"><td class="nowrap"><b>${esc(d.nr)}</b></td><td class="nowrap">${fmtD(d.datum)}</td><td>${esc(firstLine(d.empfaenger))}</td>
      <td class="small">${esc(d.positionen.map(p=>fmtNum(p.menge)+'× '+p.bezeichnung).join(', '))}</td><td class="r nowrap">${eur(docSum(d).gesamt)}</td><td>${statusBadge(d)}</td><td class="acts-cell"><div class="acts">${a.join('')}</div></td></tr>`;
  });
  return pageHead('Verkauf & Rechnungen',`<button class="btn primary" onclick="App.docEditor('rechnung',null,{bar:true})">+ Barverkauf</button><button class="btn primary" onclick="App.docEditor('rechnung')">+ Rechnung</button><button class="btn" onclick="App.csvRechnungen()">CSV-Export</button>`)+
  `<p class="muted small">Jeder Verkauf wird als Rechnung erfasst und verringert den Lagerbestand. Die Einnahme wird gebucht, sobald die Rechnung bezahlt ist (beim Barverkauf sofort).</p>
  <div class="filters">${fDate('verkauf','von','Von')}${fDate('verkauf','bis','Bis')}${fSel('verkauf','status','Status',[['','alle'],['offen','offen'],['ueberfaellig','überfällig'],['bezahlt','bezahlt'],['storniert','storniert']])}${fText('verkauf','q','Suche','Nr., Kunde, Artikel …')}${fReset('verkauf')}</div>
  <div class="sumbar"><span>${list.length} Rechnung(en)</span><span>Summe (ohne Stornos): <b>${eur(sum(aktiv,d=>docSum(d).gesamt))}</b></span><span>davon offen: <b class="neg">${eur(sum(aktiv.filter(d=>d.status==='offen'),d=>docSum(d).gesamt))}</b></span></div>`+
  table(['Nr.','Datum','Kunde','Positionen',['Betrag','r'],'Status',['','r']],rows,'','Noch keine Verkäufe. Mit „+ Barverkauf“ oder „+ Rechnung“ starten.');
}

  list.sort((a,b)=>b.datum.localeCompare(a.datum)||b.nr.localeCompare(a.nr));
  const rows=list.map(d=>{
    const a=[`<button class="btn small" onclick="App.printDoc('${d.id}')">Drucken / PDF</button>`];
    if(d.status==='offen')a.push(`<button class="btn small ok" onclick="App.angebotZuRechnung('${d.id}')">→ Rechnung</button>`,`<button class="btn small" onclick="App.docEditor('angebot','${d.id}')">Bearbeiten</button>`,`<button class="btn small" onclick="App.angebotStatus('${d.id}','abgelehnt')">Abgelehnt</button>`);

    return`<tr><td class="nowrap"><b>${esc(d.nr)}</b></td><td class="nowrap">${fmtD(d.datum)}</td><td>${esc(firstLine(d.empfaenger))}</td><td class="r nowrap">${eur(docSum(d).gesamt)}</td><td>${statusBadge(d)}</td><td class="acts-cell"><div class="acts">${a.join('')}</div></td></tr>`;
  });
  return pageHead('Angebote',`<button class="btn primary" onclick="App.docEditor('angebot')">+ Angebot</button>`)+

  <div class="filters">${fSel('angebote','status','Status',[['','alle'],['offen','offen'],['abgelaufen','abgelaufen'],['angenommen','angenommen'],['abgelehnt','abgelehnt']])}${fText('angebote','q','Suche','Nr., Kunde …')}${fReset('angebote')}</div>`+
  table(['Nr.','Datum','Kunde',['Betrag','r'],'Status',['','r']],rows,'','Noch keine Angebote.');

      <td>${e.status==='bezahlt'?`<span class="badge ok">bezahlt ${fmtD(e.bezahltAm)} · ${e.zahlungsart==='bank'?'Bank':'bar'}</span>`:'<span class="badge warn">noch nicht bezahlt</span>'}</td><td class="acts-cell"><div class="acts">${a.join('')}</div></td></tr>`;

  <div class="sumbar"><span>${list.length} Einkauf/Einkäufe</span><span>Summe: <b>${eur(sum(list,ekSum))}</b></span><span>davon offen: <b class="neg">${eur(sum(list.filter(e=>e.status==='offen'),ekSum))}</b></span></div>`+

/* ---------- Inventar ---------- */
function vInventar(){
  const f=F.inventar,m=stockMap();
  let list=DB.artikel.filter(a=>f.inaktiv||a.aktiv!==false);
  if(f.q){const q=f.q.toLowerCase();list=list.filter(a=>(a.nr+' '+a.name+' '+(a.beschreibung||'')).toLowerCase().includes(q));}
  list.sort((a,b)=>(a.nr||'').localeCompare(b.nr||'',undefined,{numeric:true}));
  let wert=0;
  const rows=list.map(a=>{
    const lager=isLager(a),best=m[a.id]||0,w=lager?r2(best*(+a.ekPreis||0)):0;wert+=w;
    const low=lager&&a.aktiv!==false&&(best<=0||(+a.mindestbestand>0&&best<=+a.mindestbestand));
    const marge=r2((+a.vkPreis||0)-(+a.ekPreis||0));
    const act=[`<button class="btn small" onclick="App.artikelForm('${a.id}')">Bearbeiten</button>`];
    if(lager)act.push(`<button class="btn small" onclick="App.korrektur('${a.id}')">Bestand korrigieren</button>`);
    act.push(`<button class="btn small" onclick="App.verlauf('${a.id}')">Verlauf</button>`);
    if(isLK())act.push(`<button class="btn small danger" onclick="App.delArtikel('${a.id}')">Löschen</button>`);
    return`<tr class="${low?'low':''}"><td class="nowrap">${esc(a.nr)}</td><td><b>${esc(a.name)}</b>${a.aktiv===false?' <span class="badge muted">inaktiv</span>':''}${a.beschreibung?`<div class="small muted">${esc(a.beschreibung)}</div>`:''}</td>
      <td class="r">${eur(a.ekPreis)}</td><td class="r">${eur(a.vkPreis)}</td><td class="r ${marge<0?'neg':''}">${eur(marge)}</td>
      <td class="r nowrap">${lager?`<b>${fmtNum(best)}</b> ${esc(a.einheit)}`:'<span class="muted">– (Dienstleistung)</span>'}</td><td class="r">${lager&&+a.mindestbestand?fmtNum(a.mindestbestand):''}</td><td class="r">${lager?eur(w):''}</td>
      <td class="acts-cell"><div class="acts">${act.join('')}</div></td></tr>`;
  });
  return pageHead('Inventar',`<button class="btn primary" onclick="App.artikelForm()">+ Artikel</button><button class="btn" onclick="App.printInventur()">Inventurliste drucken</button><button class="btn" onclick="App.csvInventar()">CSV-Export</button>`)+
  `<p class="muted small">Der Bestand ergibt sich automatisch aus Anfangsbestand, Einkäufen, Verkäufen und Korrekturen. Gelb markiert: Bestand am oder unter dem Mindestbestand.</p>
  <div class="filters">${fText('inventar','q','Suche','Artikel-Nr., Bezeichnung …')}<label class="check" style="margin-bottom:14px"><input type="checkbox" ${f.inaktiv?'checked':''} onchange="App.setF('inventar','inaktiv',this.checked)"> inaktive Artikel anzeigen</label></div>`+
  table(['Art.-Nr.','Bezeichnung',['EK-Preis','r'],['VK-Preis','r'],['Rohgewinn/Stk.','r'],['Bestand','r'],['Mindest','r'],['Lagerwert (EK)','r'],['','r']],rows,
    `<tr><td colspan="7">Lagerwert gesamt (zu Einkaufspreisen)</td><td class="r">${eur(wert)}</td><td></td></tr>`,'Noch keine Artikel angelegt. Mit „+ Artikel“ beginnen.');
}

/* ---------- Einnahmen & Ausgaben ---------- */
function filteredBuchungen(){
  const f=F.buchungen;
  let list=DB.buchungen.filter(b=>inRange(b.datum,f.von,f.bis));
  if(f.typ)list=list.filter(b=>b.typ===f.typ);
  if(f.kat)list=list.filter(b=>b.kategorie===f.kat);
  if(f.za)list=list.filter(b=>(b.zahlungsart||'bar')===f.za);
  if(f.q){const q=f.q.toLowerCase();list=list.filter(b=>((b.beschreibung||'')+' '+(b.beleg||'')+' '+(b.kategorie||'')).toLowerCase().includes(q));}
  return list.sort((a,b)=>b.datum.localeCompare(a.datum)||(b.created||'').localeCompare(a.created||''));
}

/* ---------- Auswertung ---------- */
function presetRange(p){
  const d=new Date(),y=d.getFullYear(),mo=d.getMonth()+1;
  if(p==='jahr')return[`${y}-01-01`,`${y}-12-31`];
  if(p==='vorjahr')return[`${y-1}-01-01`,`${y-1}-12-31`];
  if(p==='schuljahr'){const s=mo>=8?y:y-1;return[`${s}-08-01`,`${s+1}-07-31`];}
  if(p==='vorschuljahr'){const s=(mo>=8?y:y-1)-1;return[`${s}-08-01`,`${s+1}-07-31`];}
  if(p==='monat'){const last=new Date(y,mo,0).getDate();return[`${y}-${pad(mo)}-01`,`${y}-${pad(mo)}-${pad(last)}`];}
  return['',''];
}
function auswertungData(von,bis){
  const bs=DB.buchungen.filter(b=>inRange(b.datum,von,bis));
  const group=t=>{const g={};bs.filter(b=>b.typ===t).forEach(b=>{g[b.kategorie]=(g[b.kategorie]||0)+(+b.betrag||0);});return Object.entries(g).map(([k,v])=>[k,r2(v)]).sort((a,b)=>b[1]-a[1]);};
  const ein=group('einnahme'),aus=group('ausgabe');
  const sE=sum(ein,x=>x[1]),sA=sum(aus,x=>x[1]);
  const months={};bs.forEach(b=>{const k=b.datum.slice(0,7);months[k]=months[k]||{e:0,a:0};months[k][b.typ==='einnahme'?'e':'a']+=(+b.betrag||0);});
  const art={};
  DB.dokumente.filter(d=>d.typ==='rechnung'&&d.status!=='storniert'&&inRange(d.datum,von,bis)).forEach(d=>{
    const f=1-(+d.rabatt||0)/100;
    d.positionen.forEach(p=>{const k=p.artikelId||('frei:'+p.bezeichnung);art[k]=art[k]||{name:p.artikelId&&artikelById(p.artikelId)?artikelById(p.artikelId).name:p.bezeichnung,menge:0,umsatz:0,einheit:p.einheit};art[k].menge+=+p.menge||0;art[k].umsatz+=posSum(p)*f;});
  });
  const offeneR=DB.dokumente.filter(d=>d.typ==='rechnung'&&d.status==='offen'&&(!bis||d.datum<=bis));
  const offeneE=DB.einkaeufe.filter(e=>e.status==='offen'&&(!bis||e.datum<=bis));
  const m=stockMap();
  const warenwert=sum(DB.artikel.filter(isLager),a=>(m[a.id]||0)*(+a.ekPreis||0));
  return{bs,ein,aus,sE,sA,erg:r2(sE-sA),months:Object.entries(months).sort(),art:Object.values(art).sort((a,b)=>b.umsatz-a.umsatz),offeneR,offeneE,warenwert};
}
function rangeLabel(von,bis){if(!von&&!bis)return'gesamter Zeitraum';return`${von?fmtD(von):'Beginn'} – ${bis?fmtD(bis):'heute'}`;}
function vAuswertung(){
  const f=F.auswertung;
  if(!f.von&&!f.bis&&!f.init){[f.von,f.bis]=presetRange('jahr');f.init=true;}
  const d=auswertungData(f.von,f.bis);
  const max=Math.max(1,...d.ein.map(x=>x[1]),...d.aus.map(x=>x[1]));
  const catRows=(list,cls)=>list.map(([k,v])=>`<tr><td>${esc(k)}</td><td style="width:40%"><div class="bar ${cls}"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></td><td class="r">${eur(v)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">keine</td></tr>';
  const pr=[['monat','Aktueller Monat'],['jahr','Kalenderjahr '+new Date().getFullYear()],['vorjahr','Vorjahr'],['schuljahr','Aktuelles Schuljahr'],['vorschuljahr','Letztes Schuljahr'],['alle','Gesamter Zeitraum']];
  return pageHead('Auswertung',`<button class="btn" onclick="App.printReport()">Drucken / PDF</button><button class="btn" onclick="App.csvReport()">CSV-Export</button>`)+
  `<div class="filters">${fDate('auswertung','von','Von')}${fDate('auswertung','bis','Bis')}
    <div class="presets" style="flex-basis:100%">${pr.map(([k,l])=>`<button class="btn small" onclick="App.preset('${k}')">${l}</button>`).join('')}</div></div>
  <div class="card"><h2>Einnahmen-Überschuss-Rechnung · ${rangeLabel(f.von,f.bis)}</h2>
    <p class="muted small">Maßgeblich ist das Zahlungsdatum (Zuflussprinzip): Erfasst werden alle tatsächlich erhaltenen und geleisteten Zahlungen im Zeitraum.</p>
    <div class="kpis"><div class="kpi"><div class="label">Summe Einnahmen</div><div class="val pos">${eur(d.sE)}</div></div>
    <div class="kpi"><div class="label">Summe Ausgaben</div><div class="val neg">${eur(d.sA)}</div></div>
    <div class="kpi"><div class="label">${d.erg>=0?'Überschuss':'Fehlbetrag'}</div><div class="result ${d.erg>=0?'pos':'neg'}">${eur(d.erg)}</div></div></div>
    <div class="cols2"><div><h3>Einnahmen nach Kategorie</h3><table class="list">${catRows(d.ein,'e')}</table></div>
    <div><h3>Ausgaben nach Kategorie</h3><table class="list">${catRows(d.aus,'a')}</table></div></div>
  </div>
  <div class="cols2">
    <div class="card"><h2>Monatsübersicht</h2>${d.months.length?`<table class="list"><thead><tr><th>Monat</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Saldo</th></tr></thead><tbody>${d.months.map(([k,v])=>`<tr><td>${MONATE[+k.slice(5)-1]} ${k.slice(0,4)}</td><td class="r pos">${eur(v.e)}</td><td class="r neg">${eur(v.a)}</td><td class="r ${v.e-v.a>=0?'pos':'neg'}">${eur(v.e-v.a)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Keine Buchungen im Zeitraum.</p>'}</div>
    <div class="card"><h2>Verkaufte Artikel</h2><p class="muted small">nach Rechnungsdatum, ohne Stornos, nach Rabatt</p>${d.art.length?`<table class="list"><thead><tr><th>Artikel</th><th class="r">Menge</th><th class="r">Umsatz</th></tr></thead><tbody>${d.art.map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${fmtNum(a.menge)} ${esc(a.einheit)}</td><td class="r">${eur(a.umsatz)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">Keine Verkäufe im Zeitraum.</p>'}</div>
  </div>
  <div class="card"><h2>Zusatzinformationen</h2><p class="muted small">Nicht Teil der Einnahmen-Überschuss-Rechnung, aber wichtig für die Beurteilung der Lage.</p>
    <div class="kpis"><div class="kpi"><div class="label">Offene Forderungen</div><div class="val">${eur(sum(d.offeneR,x=>docSum(x).gesamt))}</div><div class="sub">${d.offeneR.length} unbezahlte Rechnung(en)</div></div>

    <div class="kpi"><div class="label">Warenbestand (zu EK, aktuell)</div><div class="val">${eur(d.warenwert)}</div></div></div>
  </div>`;
}

/* ===================== Aktionen ===================== */
const App={
  go(v){view=v;closeAllModals();render();window.scrollTo(0,0);},
  goFind(v,q){F[v]=Object.fromEntries(Object.keys(F[v]).map(k=>[k,typeof F[v][k]==='boolean'?false:'']));F[v].q=q;App.go(v);},
  setF(v,k,x){F[v][k]=x;render();},
  resetF(v){Object.keys(F[v]).forEach(k=>F[v][k]=typeof F[v][k]==='boolean'?false:'');render();},
  preset(p){[F.auswertung.von,F.auswertung.bis]=presetRange(p);F.auswertung.init=true;render();},
  saveNow:()=>saveNow(),saveAs,

  /* ---- Datei ---- */
  async openFile(){
    if(!canFS){$('#fileIn').click();return;}
    try{const[h]=await showOpenFilePicker({types:[{description:'Juniorenfirma-Daten',accept:{'application/json':['.json']}}]});await loadFromHandle(h);}
    catch(e){if(e.name!=='AbortError')toast('Datei konnte nicht geöffnet werden: '+e.message,'bad');}
  },
  async reopenLast(){
    try{
      let p=await lastHandle.queryPermission({mode:'readwrite'});

      await loadFromHandle(lastHandle);

    currentUser={id:u.id,name:u.name,role:u.role};rememberUser();
    commit('Ersteinrichtung durchgeführt');render();

  kundeChanged(sel){const k=kontaktById(sel.value);if(k)$('#f_empf').value=anschrift(k);},
  saveDoc(typ,id,andPrint){
    const isR=typ==='rechnung',pos=readPositions(),e=[];
    if(!pos.length)e.push('Bitte mindestens eine Position erfassen.');
    pos.forEach((p,i)=>{if(!p.bezeichnung)e.push(`Position ${i+1}: Bezeichnung fehlt.`);if(!(p.menge>0))e.push(`Position ${i+1}: Menge muss größer als 0 sein.`);});
    const datum=val('f_datum');if(!datum)e.push('Bitte ein Datum angeben.');
    const zahlung=document.getElementById('f_zahlung')?val('f_zahlung'):null;
    const empf=val('f_empf').trim();
    if(!empf&&!(isR&&zahlung&&zahlung!=='offen'))e.push('Bitte Kunde bzw. Anschrift angeben.');
    if(e.length)return formErr(e.length>1?['Bitte prüfen:',...e]:e);
    const old=id?docById(id):null;
    const d=old?clone(old):{id:uid(),typ,created:nowStamp(),user:currentUser.name,status:'offen'};
    Object.assign(d,{kundeId:val('f_kunde')||null,empfaenger:empf||'Barverkauf',datum,positionen:pos,
      rabatt:Math.min(100,Math.max(0,parseFloat(val('f_rabatt'))||0)),einleitung:val('f_einl').trim(),bemerkung:val('f_bem').trim(),changed:nowStamp()});
    if(isR){
      d.lieferdatum=val('f_liefer');d.zielTage=Math.max(0,parseInt(val('f_ziel'),10)||0);d.faellig=addDays(datum,d.zielTage);
      if(!old){if(zahlung&&zahlung!=='offen'){d.status='bezahlt';d.bezahltAm=datum;d.zahlungsart=zahlung;}if(val('f_aus'))d.ausAngebot=val('f_aus');}
      const probs=stockProblems(d.id,movesFor(d.positionen,-1));
      if(probs.length)return formErr(['Nicht genügend Ware auf Lager:',...probs,'Bitte zuerst einen Einkauf erfassen oder den Bestand im Inventar korrigieren.']);
    }else d.gueltigBis=val('f_gueltig');
    if(!old)d.nr=nextNr(isR?S().prefix.rechnung:S().prefix.angebot,DB.dokumente.filter(x=>x.typ===typ),datum);
    if(old)DB.dokumente[DB.dokumente.indexOf(old)]=d;else DB.dokumente.push(d);
    if(d.ausAngebot&&!old){const an=docById(d.ausAngebot);if(an){an.status='angenommen';an.rechnungId=d.id;}}
    syncDoc(d);
    commit(`${isR?'Rechnung':'Angebot'} ${d.nr} ${old?'geändert':'erstellt'} (${eur(docSum(d).gesamt)})`);
    closeModal();render();toast(`${isR?'Rechnung':'Angebot'} ${d.nr} gespeichert.`);
    if(andPrint)App.printDoc(d.id);

    DB.dokumente=DB.dokumente.filter(x=>x.id!==id);
    DB.bewegungen=DB.bewegungen.filter(b=>b.bezug!==id);DB.buchungen=DB.buchungen.filter(b=>!(b.quelle&&b.quelle.id===id));
    DB.dokumente.forEach(x=>{if(x.rechnungId===id){x.status='offen';delete x.rechnungId;}});

    const nr=val(p+'nr').trim();
    if(nr&&DB.artikel.some(a=>a.nr===nr&&a.id!==id))return formErr(`Die Artikel-Nr. ${nr} ist bereits vergeben.`);
    const old=id?artikelById(id):null;
    const a=old||{id:uid(),created:nowStamp()};
    Object.assign(a,{nr,name,beschreibung:val(p+'beschr').trim(),einheit:val(p+'einh').trim()||'Stück',ekPreis:r2(parseFloat(val(p+'ek'))||0),vkPreis:r2(parseFloat(val(p+'vk'))||0),
      lager:!!val(p+'lager'),mindestbestand:Math.max(0,parseFloat(val(p+'min'))||0),aktiv:old?!!val(p+'aktiv'):true});
    if(!old){
      DB.artikel.push(a);
      const anf=parseFloat(val(p+'anf'))||0;
      if(anf>0&&a.lager)DB.bewegungen.push({id:uid(),datum:today(),artikelId:a.id,menge:anf,art:'anfang',bezug:null,text:'Anfangsbestand',created:nowStamp()});
    }
    commit(`Artikel ${a.nr} ${a.name} ${old?'geändert':'angelegt'}`);closeModal();
    if(p==='q_'){
      $$('#posBody .pos-art').forEach(sel=>{const v=sel.value;sel.innerHTML=artOptions(v,'ek');sel.value=v;});
      let row=$$('#posBody .posrow').find(tr=>!tr.querySelector('.pos-art').value&&!tr.querySelector('.pos-bez').value.trim());
      if(!row){App.addPos('ek');row=$$('#posBody .posrow').pop();}
      const sel=row.querySelector('.pos-art');sel.value=a.id;App.posArt(sel,'ek');

  korrektur(id){
    const a=artikelById(id),best=stockMap()[id]||0;
    openModal(`Bestand korrigieren: ${a.name}`,`<div class="form-err"></div>
      <p>Aktueller Bestand laut System: <b>${fmtNum(best)} ${esc(a.einheit)}</b></p>
      <div class="grid2"><label class="fld">Tatsächlicher Bestand (gezählt)<input type="number" step="any" min="0" id="k_ist" value="${best}"></label><label class="fld">Datum<input type="date" id="k_datum" value="${today()}"></label></div>
      <label class="fld">Grund<select id="k_grund"><option>Inventur (Zählung)</option><option>Schwund / Diebstahl</option><option>Beschädigung / Verderb</option><option>Eigenverbrauch / Probe</option><option>Rückgabe an Lieferant</option><option>Sonstiges</option></select></label>
      <label class="fld">Bemerkung<input id="k_bem"></label>
      <p class="muted small">Eine Bestandskorrektur verändert nur den Lagerbestand – es wird keine Einnahme oder Ausgabe gebucht.</p>`,
      `<button class="btn" data-close>Abbrechen</button><button class="btn primary" onclick="App.saveKorrektur('${id}')">Bestand übernehmen</button>`);

  saveKorrektur(id){
    const a=artikelById(id),best=stockMap()[id]||0,ist=parseFloat(val('k_ist'));
    if(!(ist>=0))return formErr('Bitte einen Bestand von 0 oder mehr angeben.');
    const diff=Math.round((ist-best)*1000)/1000;

  verlauf(id){
    const a=artikelById(id);let run=0;
    const list=DB.bewegungen.filter(b=>b.artikelId===id).sort((x,y)=>x.datum.localeCompare(y.datum)||(x.created||'').localeCompare(y.created||''));
    const rows=list.map(b=>{run=Math.round((run+b.menge)*1000)/1000;return`<tr><td class="nowrap">${fmtD(b.datum)}</td><td>${BEW_ART[b.art]||b.art}</td><td>${esc(b.text)}</td><td class="r ${b.menge>=0?'pos':'neg'}">${b.menge>0?'+':''}${fmtNum(b.menge)}</td><td class="r"><b>${fmtNum(run)}</b></td></tr>`;});
    openModal(`Bestandsverlauf: ${a.name}`,table(['Datum','Art','Vorgang',['Menge','r'],['Bestand','r']],rows.reverse(),'','Noch keine Bewegungen.'),'',{wide:true});

  async delArtikel(id){
    if(!isLK())return;

    const used=DB.dokumente.some(d=>d.positionen.some(p=>p.artikelId===id))||DB.einkaeufe.some(e=>e.positionen.some(p=>p.artikelId===id))||DB.bewegungen.some(b=>b.artikelId===id&&b.art!=='anfang');

      <div class="grid2"><label class="fld">Kategorie<select id="b_kat">${kats.map(k=>`<option ${k===(b?b.kategorie:defKat)?'selected':''}>${esc(k)}</option>`).join('')}</select></label>
      <label class="fld">Zahlungsart<select id="b_za">${zaOptions(b?b.zahlungsart:'bar')}</select></label></div>
      <div class="grid2"><label class="fld">Belegnummer<input id="b_beleg" value="${esc(b?b.beleg:nextNr(S().prefix.buchung,DB.buchungen,today(),'beleg'))}"></label>
      <label class="fld">${typ==='einnahme'?'Zahler':'Empfänger'} (optional)<select id="b_kontakt"><option value="">—</option>${DB.kontakte.slice().sort((x,y)=>x.name.localeCompare(y.name)).map(k=>`<option value="${k.id}" ${b&&b.kontaktId===k.id?'selected':''}>${esc(k.name)}</option>`).join('')}</select></label></div>`,

  saveBuchung(id,typ){

  async delBuchung(id){

  saveSettings(){
    const s=S(),f=s.firma;
    const name=val('e_name').trim();if(!name){toast('Bitte den Namen der Juniorenfirma angeben.','bad');return;}
    const pref={rechnung:val('e_pR').trim(),angebot:val('e_pA').trim(),einkauf:val('e_pE').trim(),buchung:val('e_pB').trim()};
    if(Object.values(pref).some(p=>!/^[A-Za-z0-9]{1,6}$/.test(p))){toast('Kürzel dürfen nur Buchstaben und Ziffern enthalten (1–6 Zeichen).','bad');return;}
    if(new Set(Object.values(pref)).size<4){toast('Die Kürzel müssen unterschiedlich sein.','bad');return;}
    Object.assign(f,{name,zusatz:val('e_zusatz').trim(),strasse:val('e_strasse').trim(),plzOrt:val('e_plzOrt').trim(),telefon:val('e_telefon').trim(),email:val('e_email').trim(),web:val('e_web').trim(),
      inhaber:val('e_inhaber').trim(),bank:val('e_bank').trim(),iban:val('e_iban').trim(),bic:val('e_bic').trim()});
    const lines=id=>[...new Set(val(id).split('\n').map(x=>x.trim()).filter(Boolean))];
    const kE=lines('e_kE'),kA=lines('e_kA'),ei=lines('e_einh');
    if(!kE.length||!kA.length){toast('Es muss mindestens eine Kategorie für Einnahmen und Ausgaben geben.','bad');return;}
    Object.assign(s,{prefix:pref,zahlungszielTage:Math.max(0,parseInt(val('e_ziel'),10)||0),angebotGueltigTage:Math.max(0,parseInt(val('e_gueltig'),10)||0),
      steuerhinweis:val('e_steuer').trim(),textRechnung:val('e_tR').trim(),textAngebot:val('e_tA').trim(),katEinnahmen:kE,katAusgaben:kA,einheiten:ei.length?ei:['Stück'],
      anfangBar:r2(parseFloat(val('e_aBar'))||0),anfangBank:r2(parseFloat(val('e_aBank'))||0)});
    commit('Einstellungen geändert');render();toast('Einstellungen gespeichert.');
  },
  userForm(id){
    const u=id?DB.users.find(x=>x.id===id):null;
    openModal(u?'Benutzer bearbeiten':'Neuer Benutzer',`<div class="form-err"></div>
      <label class="fld">Name *<input id="u_name" value="${esc(u?u.name:'')}" placeholder="z. B. Lena Schmidt"></label>
      <div class="grid2"><label class="fld">Benutzername *<input id="u_login" value="${esc(u?u.login:'')}" autocomplete="off"></label>
      <label class="fld">Rolle<select id="u_role"><option value="schueler" ${!u||u.role==='schueler'?'selected':''}>Schüler/in</option><option value="lehrkraft" ${u&&u.role==='lehrkraft'?'selected':''}>Lehrkraft</option></select></label></div>
      ${u?`<label class="check"><input type="checkbox" id="u_active" ${u.active!==false?'checked':''}> Konto aktiv (deaktivierte Konten können sich nicht anmelden)</label>`:`<label class="fld">Startpasswort *<input id="u_pw" type="text" autocomplete="off"></label>`}`,
      `<button class="btn" data-close>Abbrechen</button><button class="btn primary" onclick="App.saveUser(${js(id||'')})">Speichern</button>`);
  },
  async saveUser(id){
    const name=val('u_name').trim(),login=val('u_login').trim().toLowerCase(),role=val('u_role');
    if(!name||!login)return formErr('Bitte Name und Benutzername angeben.');
    if(DB.users.some(x=>x.login===login&&x.id!==id))return formErr('Dieser Benutzername ist bereits vergeben.');
    const old=id?DB.users.find(x=>x.id===id):null;
    if(old){
      const active=!!val('u_active');
      const otherLK=DB.users.some(x=>x.id!==id&&x.role==='lehrkraft'&&x.active!==false);
      if((role!=='lehrkraft'||!active)&&old.role==='lehrkraft'&&!otherLK)return formErr('Es muss mindestens eine aktive Lehrkraft geben.');
      Object.assign(old,{name,login,role,active});
      if(old.id===currentUser.id)currentUser={id:old.id,name,role};
    }else{
      const pw=val('u_pw');if(pw.length<4)return formErr('Das Startpasswort muss mindestens 4 Zeichen lang sein.');
      const salt=uid();DB.users.push({id:uid(),name,login,role,salt,hash:await hashPw(salt,pw),active:true});
    }
    commit(`Benutzer ${name} ${old?'geändert':'angelegt'}`);closeModal();render();toast('Benutzer gespeichert.');
  },
  resetPw(id){
    const u=DB.users.find(x=>x.id===id);
    openModal(`Passwort setzen: ${u.name}`,`<div class="form-err"></div><label class="fld">Neues Passwort<input id="r_pw" type="text" autocomplete="off"></label><p class="muted small">Teilen Sie das Passwort der Person mit. Sie kann es danach selbst ändern.</p>`,
      `<button class="btn" data-close>Abbrechen</button><button class="btn primary" onclick="App.saveResetPw('${id}')">Passwort setzen</button>`);
  },
  async saveResetPw(id){
    const pw=val('r_pw');if(pw.length<4)return formErr('Das Passwort muss mindestens 4 Zeichen lang sein.');
    const u=DB.users.find(x=>x.id===id);u.salt=uid();u.hash=await hashPw(u.salt,pw);commit(`Passwort für ${u.name} neu gesetzt`);closeModal();toast('Passwort gesetzt.');
  },
  async delUser(id){
    const u=DB.users.find(x=>x.id===id);
    if(u.role==='lehrkraft'&&!DB.users.some(x=>x.id!==id&&x.role==='lehrkraft'&&x.active!==false)){toast('Es muss mindestens eine aktive Lehrkraft geben.','bad');return;}
    if(!(await ask(`Benutzer „${esc(u.name)}“ löschen? Die erfassten Vorgänge bleiben erhalten.`,'Löschen',true)))return;
    DB.users=DB.users.filter(x=>x.id!==id);commit(`Benutzer ${u.name} gelöscht`);render();
  },
  backup(){download(JSON.stringify(DB,null,1),`juniorenfirma-sicherung-${today()}.json`,'application/json');log('Sicherung heruntergeladen');commit();},
  restore(inp){
    const file=inp.files[0];if(!file)return;inp.value='';
    const r=new FileReader();
    r.onload=async()=>{
      let data;try{data=migrate(JSON.parse(r.result));}catch(e){toast(e.message,'bad');return;}
      if(!(await ask(`Sicherung „${esc(file.name)}“ einspielen? <b>Alle aktuellen Daten werden durch den Stand der Sicherung ersetzt.</b> Laden Sie vorher ggf. eine Sicherung des aktuellen Stands herunter.`,'Sicherung einspielen',true)))return;
      const me=currentUser;DB=data;
      if(!DB.users.find(u=>u.id===me.id))currentUser=null;
      commit(`Sicherung ${file.name} eingespielt`);render();toast('Sicherung eingespielt.');
    };
    r.readAsText(file);
  },

  csvReport(){
    const f=F.auswertung,d=auswertungData(f.von,f.bis);
    const rows=[['Einnahmen-Überschuss-Rechnung',S().firma.name],['Zeitraum',rangeLabel(f.von,f.bis)],[],['Einnahmen','Betrag']];
    d.ein.forEach(([k,v])=>rows.push([k,v]));rows.push(['Summe Einnahmen',d.sE],[],['Ausgaben','Betrag']);
    d.aus.forEach(([k,v])=>rows.push([k,v]));rows.push(['Summe Ausgaben',d.sA],[],[d.erg>=0?'Überschuss':'Fehlbetrag',d.erg],[],['Monat','Einnahmen','Ausgaben','Saldo']);
    d.months.forEach(([k,v])=>rows.push([MONATE[+k.slice(5)-1]+' '+k.slice(0,4),r2(v.e),r2(v.a),r2(v.e-v.a)]));
    rows.push([],['Buchungen im Zeitraum'],['Datum','Beleg','Art','Kategorie','Beschreibung','Zahlungsart','Betrag']);

  printReport(){

      <h2>Ausgaben</h2><table class="p-tab"><tbody>${cat(d.aus)}</tbody><tfoot><tr><td>Summe Ausgaben</td><td class="r">${eur(d.sA)}</td></tr></tfoot></table>

      ${d.months.length?`<h2>Monatsübersicht</h2><table class="p-tab"><thead><tr><th>Monat</th><th class="r">Einnahmen</th><th class="r">Ausgaben</th><th class="r">Saldo</th></tr></thead><tbody>${d.months.map(([k,v])=>`<tr><td>${MONATE[+k.slice(5)-1]} ${k.slice(0,4)}</td><td class="r">${eur(v.e)}</td><td class="r">${eur(v.a)}</td><td class="r">${eur(v.e-v.a)}</td></tr>`).join('')}</tbody></table>`:''}
      <h2>Zusatzinformationen</h2><table class="p-tab"><tbody><tr><td>Offene Forderungen (${d.offeneR.length} Rechnungen)</td><td class="r">${eur(sum(d.offeneR,x=>docSum(x).gesamt))}</td></tr>
      <tr><td>Offene Verbindlichkeiten (${d.offeneE.length} Einkäufe)</td><td class="r">${eur(sum(d.offeneE,ekSum))}</td></tr><tr><td>Warenbestand zu Einkaufspreisen (Stand ${fmtD(today())})</td><td class="r">${eur(d.warenwert)}</td></tr></tbody></table>
      <h2>Einzelbuchungen</h2><table class="p-tab"><thead><tr><th>Datum</th><th>Beleg</th><th>Kategorie</th><th>Beschreibung</th><th class="r">Einnahme</th><th class="r">Ausgabe</th></tr></thead>
      <tbody>${d.bs.slice().sort((a,b)=>a.datum.localeCompare(b.datum)).map(b=>`<tr><td>${fmtD(b.datum)}</td><td>${esc(b.beleg)}</td><td>${esc(b.kategorie)}</td><td>${esc(b.beschreibung)}</td><td class="r">${b.typ==='einnahme'?eur(b.betrag):''}</td><td class="r">${b.typ==='ausgabe'?eur(b.betrag):''}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="4">Summen</td><td class="r">${eur(d.sE)}</td><td class="r">${eur(d.sA)}</td></tr></tfoot></table>
      <div class="p-sign"><div>Datum, Unterschrift Geschäftsführung</div><div>Datum, Unterschrift betreuende Lehrkraft</div></div></div>`;
    doPrint(html,`EÜR ${S().firma.name} ${rangeLabel(f.von,f.bis)}`);
  },
  printInventur(){
    const m=stockMap();let w=0;
    const rows=DB.artikel.filter(a=>isLager(a)&&a.aktiv!==false).sort((a,b)=>(a.nr||'').localeCompare(b.nr||'',undefined,{numeric:true})).map(a=>{const b=m[a.id]||0,v=r2(b*(+a.ekPreis||0));w+=v;
      return`<tr><td>${esc(a.nr)}</td><td>${esc(a.name)}</td><td>${esc(a.einheit)}</td><td class="r">${fmtNum(b)}</td><td style="width:22mm;border-bottom:1px solid #333"></td><td class="r">${eur(a.ekPreis)}</td><td class="r">${eur(v)}</td></tr>`;}).join('');
    doPrint(`<div class="pdoc p-report">${firmaHead()}<h1>Inventurliste</h1><p>Stand laut System: ${fmtD(today())}</p>
      <table class="p-tab"><thead><tr><th>Art.-Nr.</th><th>Bezeichnung</th><th>Einheit</th><th class="r">Soll-Bestand</th><th>Ist (gezählt)</th><th class="r">EK-Preis</th><th class="r">Wert (Soll)</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="6">Lagerwert gesamt</td><td class="r">${eur(w)}</td></tr></tfoot></table>
      <div class="p-sign"><div>Gezählt von (Datum, Unterschrift)</div><div>Geprüft von (Datum, Unterschrift)</div></div></div>`,`Inventurliste ${today()}`);
  }
};

function rememberUser(){try{sessionStorage.setItem('jf_user',currentUser.id+'|'+DB.meta.created);}catch(e){}}
function autoLogin(){
  try{const[id,c]=(sessionStorage.getItem('jf_user')||'').split('|');const u=DB.users.find(x=>x.id===id&&x.active!==false);
    if(u&&c===DB.meta.created)currentUser={id:u.id,name:u.name,role:u.role};else currentUser=null;}catch(e){currentUser=null;}
}
async function loadFromHandle(h){
  const f=await h.getFile();
  const data=migrate(JSON.parse(await f.text()));
  DB=data;fileHandle=h;fileName=h.name;lastMod=f.lastModified;lastSaveId=DB.meta.saveId;dirty=false;saveError=false;demoMode=false;
  lastHandle=h;idbSet('lastHandle',h);
  autoLogin();view='dashboard';render();
}
